name: Build Windows signing candidate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $assemblyInfo = Get-Content -LiteralPath src/AssemblyInfo.cs -Raw
          $match = [regex]::Match($assemblyInfo, 'AssemblyInformationalVersion\("(?<version>[^"+]+)')
          if (-not $match.Success) {
            throw 'Could not read the Clipman version.'
          }
          $version = $match.Groups['version'].Value
          $expectedTag = "v$version"
          $isTagBuild = $env:GITHUB_REF -like 'refs/tags/*'
          $buildWindows = -not $isTagBuild -or $env:GITHUB_REF_NAME -eq $expectedTag
          "value=$version" >> $env:GITHUB_OUTPUT
          "build_windows=$($buildWindows.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Explain non-Windows client tag
        if: steps.version.outputs.build_windows != 'true'
        shell: pwsh
        run: |
          $expected = "v${{ steps.version.outputs.value }}"
          Write-Host "Tag $env:GITHUB_REF_NAME is not the Windows release tag $expected. Skipping the Windows signing candidate."

      - name: Build Windows application
        if: steps.version.outputs.build_windows == 'true'
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'Clipman/clipman.exe'
          ./Build.ps1 -OutputPath $output -DesktopOnly

      - name: Verify and package candidate
        if: steps.version.outputs.build_windows == 'true'
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'Clipman'
          $exe = Join-Path $stage 'clipman.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            throw 'The Windows build did not produce clipman.exe.'
          }
          $actual = [Diagnostics.FileVersionInfo]::GetVersionInfo($exe).ProductVersion
          $expected = '${{ steps.version.outputs.value }}'
          if ($actual -ne $expected) {
            throw "Built product version $actual does not match $expected."
          }
          foreach ($required in @('Manual.html', 'LICENSE.txt', 'sqlite3.dll', 'sounds')) {
            if (-not (Test-Path -LiteralPath (Join-Path $stage $required))) {
              throw "Required release item is missing: $required"
            }
          }
          $archive = Join-Path $env:RUNNER_TEMP "Clipman-$expected-unsigned.zip"
          Compress-Archive -LiteralPath (Get-ChildItem -LiteralPath $stage).FullName -DestinationPath $archive

      - name: Upload unsigned signing candidate
        if: steps.version.outputs.build_windows == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Clipman-${{ steps.version.outputs.value }}-windows-unsigned
          path: ${{ runner.temp }}/Clipman-${{ steps.version.outputs.value }}-unsigned.zip
          if-no-files-found: error
          retention-days: 14
