name: Publish Clipman Server container

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Clipman Server version to publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'server-v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        shell: bash
        run: |
          set -euo pipefail
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/clipman-server"
          if [[ '${{ github.event_name }}' == 'workflow_dispatch' ]]; then
            version='${{ inputs.version }}'
          else
            version="${GITHUB_REF_NAME#server-v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Clipman Server version: $version" >&2
            exit 1
          fi

          docker build \
            -f ClipmanServerDocker/Dockerfile \
            -t "${image}:latest" \
            -t "${image}:${version}" \
            .

          docker push "${image}:latest"
          docker push "${image}:${version}"
