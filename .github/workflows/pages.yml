name: Publish Clipman manual

on:
  push:
    branches:
      - main
    paths:
      - Manual.html
      - ClipmanServer/Manual.html
      - .github/workflows/pages.yml
      - README.md
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare manual site
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/clipman-pages"
          mkdir -p "$site/server"
          install -m 0644 Manual.html "$site/index.html"
          install -m 0644 Manual.html "$site/Manual.html"
          install -m 0644 Manual.html "$site/manual.html"
          install -m 0644 ClipmanServer/Manual.html "$site/server/index.html"
          install -m 0644 ClipmanServer/Manual.html "$site/server/Manual.html"
          install -m 0644 ClipmanServer/Manual.html "$site/server/manual.html"

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq \
            '[.[] | select(.draft == false and .prerelease == false and (.tag_name | startswith("server-v")))] | sort_by(.published_at) | reverse | .[0]')"
          tag="$(jq -r '.tag_name // empty' <<<"$release_json")"
          if [[ ! "$tag" =~ ^server-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "No valid published Clipman Server release was found." >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          asset_name="ClipmanServer-${version}.zip"
          asset_url="$(jq -r --arg name "$asset_name" '.assets[] | select(.name == $name) | .browser_download_url' <<<"$release_json")"
          expected_prefix="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/"
          if [[ "$asset_url" != "${expected_prefix}${asset_name}" ]]; then
            echo "The latest server release does not contain the expected ${asset_name} asset." >&2
            exit 1
          fi

          cat >"$site/server/download.html" <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0; url=${asset_url}">
            <title>Download Clipman Server ${version}</title>
          </head>
          <body>
            <main>
              <h1>Download Clipman Server ${version}</h1>
              <p>Your download should begin automatically. <a href="${asset_url}">Download Clipman Server ${version}</a> if it does not.</p>
              <p><a href="manual.html">Read the Clipman Server manual</a>.</p>
            </main>
          </body>
          </html>
          EOF
          install -m 0644 "$site/server/download.html" "$site/server/latest.html"
          touch "$site/.nojekyll"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload manual site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/clipman-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
